<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPod für Spotify</title>
<style>
:root{--bg:#e4e4ea;--ink:#222;--b1:#fbfbfb;--b2:#cdced3;--sc:#c8d6bd;--st:#18281a;--s1:#53a0f0;--s2:#1c5fb8;--w:#f6f6f8;--wl:#7a7a80;--c1:#ececee;--c2:#c6c6cb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17171b;--ink:#eee}}
html,body{margin:0;height:100%}
body[data-theme="schwarz"]{--b1:#3a3a3f;--b2:#0e0e10;--sc:#dfe9f5;--st:#10202f;--w:#1d1d20;--wl:#b5b5bb;--c1:#3a3a3e;--c2:#222225}
body[data-theme="rot"]{--b1:#e0404c;--b2:#8f1621;--sc:#d9e4f2;--st:#10243a;--w:#f3ebec;--wl:#8a6a6e}
body[data-theme="mint"]{--b1:#cdeedd;--b2:#86b9a2;--w:#f2f8f5}
body[data-theme="nacht"]{--b1:#4a5b78;--b2:#1b2536;--sc:#0d2b4a;--st:#bfe4ff;--s1:#2f8cf0;--s2:#0f56b8;--w:#e9edf4}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
.ipod{width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--b1),var(--b2));padding:16px 16px 22px;max-width:520px;margin:0 auto}
.screen{position:relative;background:var(--sc);border:3px solid #7f858c;border-radius:8px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;color:var(--st);font-size:18px}
#vol{position:absolute;left:12%;right:12%;bottom:14px;background:rgba(20,20,20,.88);color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;display:none}
#vol .prog{margin:6px 0 0;background:#444;border-color:#999}
#art{position:absolute;right:0;top:24px;bottom:0;width:44%;display:none;align-items:center;justify-content:center;border-left:1px solid rgba(0,0,0,.25);background:rgba(0,0,0,.06)}
#art img,#art .ph{width:84%;aspect-ratio:1;object-fit:cover;border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
#art .ph{display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(var(--s1),var(--s2));color:#fff}
.bar{display:flex;justify-content:space-between;padding:3px 8px;font-weight:700;font-size:13px;background:linear-gradient(#ececec,#a8a8a8);border-bottom:1px solid #777;color:#222}
.list{flex:1;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;white-space:nowrap;overflow:hidden}
.row span:first-child{overflow:hidden;text-overflow:ellipsis}
.row.sel{background:linear-gradient(var(--s1),var(--s2));color:#fff}
.np{padding:14px;display:flex;flex-direction:column;gap:14px;height:100%;box-sizing:border-box}
.np .prog{margin-top:auto}
.g{display:flex;flex-direction:column;gap:6px}
.np b{font-size:19px}
.npt{display:flex;gap:10px;align-items:flex-start}
.cov{width:min(40vw,160px);height:min(40vw,160px);border-radius:4px;object-fit:cover;background:rgba(0,0,0,.15);flex:none}
.inf{display:flex;flex-direction:column;justify-content:space-between;align-self:stretch;gap:14px;min-width:0}
.inf span{font-size:15px;line-height:1.3}
.inf .sm{font-size:13px;opacity:.8}
.th{width:30px;height:30px;border-radius:3px;margin-right:8px;object-fit:cover;vertical-align:middle}
.prog{height:10px;border:1px solid #333;border-radius:5px;overflow:hidden;margin-top:10px;background:#e7efe2}
.prog i{display:block;height:100%;background:linear-gradient(var(--s1),var(--s2))}
.tm{display:flex;justify-content:space-between;font-size:12px}
.wheel{width:min(80vw,40vh);height:min(80vw,40vh);flex:none;border-radius:50%;background:var(--w);margin:18px auto 0;position:relative;touch-action:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.2),0 1px 0 #fff}
.wheel button svg{display:block}
.wheel button{letter-spacing:1px;position:absolute;border:0;background:none;font-weight:700;font-size:13px;color:var(--wl);padding:10px;cursor:pointer}
#bM{top:6px;left:50%;transform:translateX(-50%)}#bP{bottom:6px;left:50%;transform:translateX(-50%)}
#bL{left:6px;top:50%;transform:translateY(-50%)}#bR{right:6px;top:50%;transform:translateY(-50%)}
#bC{left:50%;top:50%;width:36%;height:36%;margin:-18%;border-radius:50%;background:linear-gradient(var(--c1),var(--c2));box-shadow:0 1px 3px rgba(0,0,0,.3);padding:0}
#setup{position:fixed;inset:0;background:var(--bg);color:var(--ink);padding:24px;overflow:auto;display:none;box-sizing:border-box;-webkit-user-select:text;user-select:text}
#setup input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;margin:6px 0 12px}
#setup button{padding:10px 16px;font-size:16px}
#setup code{background:rgba(128,128,128,.2);padding:2px 4px;word-break:break-all}
</style></head><body>
<div class="ipod">
 <div class="screen"><div class="bar"><span id="ttl">iPod</span><span id="ind">▶</span></div><div class="list" id="body"></div><div id="art"></div><div id="vol"><span>Lautstärke</span><div class="prog"><i id="volBar" style="width:0"></i></div></div></div>
 <div class="wheel" id="wheel"><button id="bM">MENU</button><button id="bL" aria-label="Zurück"><svg viewBox="0 0 24 16" width="28" height="19" fill="currentColor"><rect x="0" y="1" width="3" height="14"/><path d="M13 1v14L4 8z"/><path d="M23 1v14L14 8z"/></svg></button><button id="bR" aria-label="Weiter"><svg viewBox="0 0 24 16" width="28" height="19" fill="currentColor"><path d="M1 1v14l9-7z"/><path d="M11 1v14l9-7z"/><rect x="21" y="1" width="3" height="14"/></svg></button><button id="bP" aria-label="Play/Pause"><svg viewBox="0 0 24 16" width="28" height="19" fill="currentColor"><path d="M1 1v14l10-7z"/><rect x="14" y="1" width="3.5" height="14"/><rect x="20" y="1" width="3.5" height="14"/></svg></button><button id="bC" aria-label="Auswählen"></button></div>
</div>
<div id="setup">
 <h2>Einmalige Einrichtung</h2>
 <ol>
  <li>Auf <b>developer.spotify.com/dashboard</b> „Create app“ wählen.</li>
  <li>Als Redirect URI genau das hier eintragen:<br><code id="ru"></code></li>
  <li>Bei „APIs/SDKs“ <b>Web API</b> und <b>Web Playback SDK</b> ankreuzen, speichern.</li>
  <li>Die <b>Client ID</b> hier einfügen:</li>
 </ol>
 <input id="cidIn" placeholder="Client ID" autocomplete="off">
 <button id="cidBtn">Speichern</button>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var REDIR=location.origin+location.pathname;
var SC="user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative user-library-read streaming user-read-email user-read-private";
var cid=localStorage.getItem("cid")||"";
var T=null;try{T=JSON.parse(localStorage.getItem("tok")||"null")}catch(e){}
if(localStorage.getItem("sv")!=="2"){T=null;localStorage.removeItem("tok");localStorage.setItem("sv","2")}
var N=null,sdkDev=null,player=null,vt=null,pref=localStorage.getItem("dev")||"";

function b64(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function login(){
 var v=b64(crypto.getRandomValues(new Uint8Array(48)));localStorage.setItem("ver",v);
 var ch=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
 location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({response_type:"code",client_id:cid,scope:SC,redirect_uri:REDIR,code_challenge_method:"S256",code_challenge:ch});
}
async function tokReq(p){
 var r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(Object.assign({client_id:cid},p))});
 var j=await r.json();if(!r.ok)throw j;
 T={a:j.access_token,r:j.refresh_token||(T&&T.r),e:Date.now()+j.expires_in*1000-60000};
 localStorage.setItem("tok",JSON.stringify(T));
}
async function token(){
 if(!T)return null;
 if(Date.now()>T.e){try{await tokReq({grant_type:"refresh_token",refresh_token:T.r})}catch(e){T=null;localStorage.removeItem("tok");return null}}
 return T.a;
}
async function api(m,p,b){
 var t=await token();if(!t)throw{status:401};
 var r=await fetch(p.indexOf("http")===0?p:"https://api.spotify.com/v1"+p,{method:m,headers:Object.assign({Authorization:"Bearer "+t},b?{"Content-Type":"application/json"}:{}),body:b?JSON.stringify(b):undefined});
 if(r.status===204||r.status===202)return null;
 var x=await r.text(),j=null;try{j=JSON.parse(x)}catch(e){}
 if(!r.ok)throw{status:r.status,j:j};
 return j;
}
async function pages(p,max){var out=[],u=p;for(var i=0;u&&i<(max||6);i++){var j=await api("GET",u);out=out.concat(j.items||[]);u=j.next}return out}
function msg(e){return e&&e.status===404?"Spotify-App öffnen":e&&e.status===403?"Kein Zugriff (Premium?)":e&&e.status===401?"Bitte neu anmelden":"Fehler"}

async function device(){
 var j=await api("GET","/me/player/devices"),d=(j&&j.devices)||[];
 var mob=/iPhone|iPad|Android/i.test(navigator.userAgent),a=d.filter(function(x){return x.id===pref})[0];
 if(!a&&mob){var ph=d.filter(function(x){return x.type==="Smartphone"||x.type==="Tablet"});a=ph.filter(function(x){return x.is_active})[0]||ph[0]}
 if(!a&&!mob)a=d.filter(function(x){return x.is_active})[0]||d.filter(function(x){return x.id===sdkDev})[0]||d[0];
 if(!a)throw{status:404};return a.id;
}
async function doPlay(o){
 var dev=await device();
 await api("PUT","/me/player/play?device_id="+dev,o.uris?{uris:o.uris}:o.whole?{context_uri:o.ctx}:{context_uri:o.ctx,offset:{position:o.i}});
 setTimeout(refreshNP,800);
}
async function refreshNP(){
 if(!T)return;
 try{var j=await api("GET","/me/player");
  if(!j||!j.item){N=null}else{var ov=N&&N.vl&&Date.now()-N.vl<4000?N.vol:null;N={ctx:j.context?j.context.uri:null,vl:ov!==null?N.vl:0,name:j.item.name,album:(j.item.album||{}).name||"",img:imgOf(j.item.album),meta:metaOf(j.item),dev:j.device?"Auf: "+j.device.name:"",artist:(j.item.artists||[]).map(function(a){return a.name}).join(", "),playing:j.is_playing,pos:j.progress_ms/1000,dur:j.item.duration_ms/1000,vol:ov!==null?ov:(j.device?j.device.volume_percent:50),shuffle:j.shuffle_state}}
 }catch(e){}
 render();
}
async function ctl(fn){try{await fn();setTimeout(refreshNP,600)}catch(e){flash(msg(e))}}
function flash(t){$("ind").textContent=t;setTimeout(render,2000)}
var vh=null;
function showVol(){var v=$("vol");v.style.display="block";$("volBar").style.width=N.vol+"%";v.firstChild.textContent="Lautstärke "+Math.round(N.vol)+"%";clearTimeout(vh);vh=setTimeout(function(){v.style.display="none"},1500)}

function fmt(n){n=Math.max(0,Math.floor(n));return Math.floor(n/60)+":"+("0"+n%60).slice(-2)}
function imgOf(a){var i=a&&a.images;return i&&i.length?(i[1]||i[0]).url:""}
function thOf(o){var i=o&&o.images;return i&&i.length?i[i.length-1].url:""}
function metaOf(t){var a=t.album||{},y=(a.release_date||"").slice(0,4),p=[];if(y)p.push(y);if(t.track_number&&a.total_tracks)p.push("Titel "+t.track_number+"/"+a.total_tracks);return p.join(" · ")}
function rootItems(){
 if(!T)return[{l:"Mit Spotify anmelden",act:login},{l:"Client ID ändern",act:function(){$("setup").style.display="block"}}];
 return[
  {l:"Musik",go:function(){return musicScreen()}},
  
  
  
  {l:"Läuft gerade",go:function(){return{t:"np",np:1}}},
  {l:"Gerät",go:function(){return{t:"Gerät wählen",load:loadDevices}}},
  {l:"Shuffle",act:function(){return ctl(function(){return api("PUT","/me/player/shuffle?state="+!(N&&N.shuffle))})}},
  
  {l:"Einstellungen",go:function(){return settingsScreen()}}
 ];
}
async function loadPlaylists(){
 var me=await api("GET","/me"),l=(await pages("/me/playlists?limit=50",4)).filter(Boolean),g={own:[],other:[],sp:[]},out=[];
 l.forEach(function(p){var o=p.owner&&p.owner.id;(o==="spotify"?g.sp:o===me.id?g.own:g.other).push(p)});
 [["Meine Playlists",g.own],["Gespeichert",g.other],["Von Spotify",g.sp]].forEach(function(x){if(x[1].length)out.push({l:x[0]+" ("+x[1].length+")",go:function(){return{t:x[0],items:x[1].map(plItem)}}})});
 return out.length?out:[{l:"Keine Playlists"}];
 function plItem(p){return{l:p.name,img:thOf(p),go:function(){return{t:p.name,load:function(){return loadTracks(p)}}}}}
}
async function loadTracks(p){
 var l;
 try{try{l=await pages("/playlists/"+p.id+"/items?limit=100",5)}catch(e){l=await pages("/playlists/"+p.id+"/tracks?limit=100",5)}}catch(e){return[{l:"Playlist abspielen",play:{ctx:p.uri,i:0,whole:1}}]}
 var out=[];l.forEach(function(x){var t=x&&(x.item||x.track);if(t&&t.name)out.push({l:t.name,play:{ctx:p.uri,i:out.length}})});
 if(!out.length)out=[{l:"Keine Titel sichtbar"}];
 return out;
}

async function loadLiked(){
 var l=await pages("/me/tracks?limit=50",8),ids=[];
 l.forEach(function(x){if(x&&x.track&&x.track.uri)ids.push([x.track.name,x.track.uri])});
 if(!ids.length)return[{l:"Keine Lieblingstitel"}];
 var uris=ids.map(function(t){return t[1]});
 return ids.map(function(t,i){return{l:t[0],play:{uris:uris.slice(i,i+100)}}});
}
async function loadAlbums(){
 var l=await pages("/me/albums?limit=50",4);
 var out=l.filter(function(x){return x&&x.album}).map(function(x){return{l:x.album.name,img:thOf(x.album),play:{ctx:x.album.uri,i:0,whole:1}}});
 return out.length?out:[{l:"Keine Alben"}];
}
function getMixes(){try{return JSON.parse(localStorage.getItem("mixes")||"[]")}catch(e){return[]}}
function mixScreen(){
 var m=getMixes(),items=m.map(function(x){return{l:x.n,play:{ctx:x.u,i:0,whole:1}}});
 items.push({l:"+ Mix hinzufügen",act:addMix});
 if(m.length)items.push({l:"Mixe löschen",act:function(){localStorage.removeItem("mixes");back();push(mixScreen())}});
 return{t:"Spotify-Mixe",items:items};
}
function addMix(){
 var u=prompt("Playlist-Link einfügen (Spotify: Teilen → Link kopieren). Leer lassen = aktuell gespielte Playlist");
 if(u===null)return;
 var id=(u.match(/playlist[\/:]([A-Za-z0-9]+)/)||[])[1],uri=id?"spotify:playlist:"+id:(N&&N.ctx);
 if(!uri||uri.indexOf("spotify:playlist:")!==0)return flash("Keine Playlist");
 var n=prompt("Name, z.B. Daylist");if(!n)return;
 var m=getMixes();m.push({n:n,u:uri});localStorage.setItem("mixes",JSON.stringify(m));
 back();push(mixScreen());
}
function openSp(){location.href="spotify://"}
async function loadDevices(){
 var j=await api("GET","/me/player/devices"),d=(j&&j.devices)||[];
 if(!d.length)return[{l:"Spotify-App öffnen",act:openSp}];
 var ty={Smartphone:"Handy",Computer:"Computer",Speaker:"Lautsprecher",Tablet:"Tablet"};
 var mob=/iPhone|iPad|Android/i.test(navigator.userAgent),hasPh=d.some(function(x){return x.type==="Smartphone"||x.type==="Tablet"});
 var lst=d.map(function(x){return{l:(x.id===pref?"✓ ":"")+x.name+" ("+(ty[x.type]||x.type)+")",act:function(){pref=x.id;localStorage.setItem("dev",x.id);ctl(function(){return api("PUT","/me/player",{device_ids:[x.id],play:false})});back()}}});
 if(mob&&!hasPh)lst.push({l:"iPhone fehlt: Spotify öffnen",act:openSp});
 return lst;
}
async function diag(){
 var out=[{l:"Version 8"}];
 out.push({l:"Startbild: "+(($("art").dataset.k||"-").slice(8,32))});
 try{
  var j=await api("GET","/me/player");
  if(!j||!j.item){out.push({l:"Kein Titel aktiv"})}
  else{
   var a=j.item.album||{},im=a.images||[];
   out.push({l:"Titel: "+j.item.name});
   out.push({l:"Album-Bilder: "+im.length});
   var u=im.length?(im[1]||im[0]).url:"";
   if(u){
    var r=await new Promise(function(res){var i=new Image();i.onload=function(){res("lädt OK "+i.width+"px")};i.onerror=function(){res("Laden FEHLGESCHLAGEN")};i.src=u;setTimeout(function(){res("Zeitüberschreitung")},6000)});
    out.push({l:"Bild: "+r});
   }
  }
 }catch(e){out.push({l:"Player: "+msg(e)})}
 try{var p=await api("GET","/me/playlists?limit=5"),f=(p.items||[])[0];out.push({l:"Playlist-Bilder: "+(f&&f.images?f.images.length:"fehlt")})}catch(e){out.push({l:"Playlists: "+msg(e)})}
 return out;
}
function musicScreen(){return{t:"Musik",items:[
 {l:"Playlists",go:function(){return{t:"Playlists",load:loadPlaylists}}},
 {l:"Lieblingstitel",go:function(){return{t:"Lieblingstitel",load:loadLiked}}},
 {l:"Alben",go:function(){return{t:"Alben",load:loadAlbums}}},
 {l:"Spotify-Mixe",go:function(){return mixScreen()}}]}}
function settingsScreen(){return{t:"Einstellungen",items:[
 {l:"Themes",go:function(){return themeScreen()}},
 {l:"Diagnose",go:function(){return{t:"Diagnose",load:diag}}},
 {l:"Abmelden",act:function(){T=null;localStorage.removeItem("tok");stack=[{s:{t:"iPod",items:rootItems()},sel:0}];render()}}]}}
var THEMES=[["Klassik Weiß","klassik"],["Schwarz","schwarz"],["Rot","rot"],["Mint","mint"],["Nacht","nacht"]];
function setTheme(id){document.body.setAttribute("data-theme",id);localStorage.setItem("theme",id)}
function themeScreen(){return{t:"Themes",items:THEMES.map(function(t){return{l:t[0],act:function(){setTheme(t[1])}}})}}
var stack=[{s:{t:"iPod",items:rootItems()},sel:0}];
function cur(){return stack[stack.length-1]}
function push(s){
 stack.push({s:s,sel:0});
 if(s.load){s.items=[{l:"Lädt…"}];render();s.load().then(function(it){s.items=it;render()}).catch(function(e){s.items=[{l:msg(e)}];render()})}
 else render();
 if(s.np)refreshNP();
}
function render(){
 var c=cur(),b=$("body");
 $("ttl").textContent=c.s.np?"Läuft gerade":c.s.t;
 $("ind").textContent=N&&N.playing?"▶":"❚❚";
 var rt=stack.length===1;
 $("body").style.width=rt?"56%":"";
 var ar=$("art");ar.style.display=rt?"flex":"none";
 if(rt){var k=N&&N.img||"-";if(ar.dataset.k!==k){ar.dataset.k=k;ar.innerHTML=N&&N.img?'<img src="'+N.img+'" alt="">':'<div class="ph">♪</div>'}}
 if(c.s.np){
  if(!N){b.innerHTML='<div class="np"><b>Nichts aktiv</b><span>Starte einen Titel über Playlists.</span></div>';return}
  b.innerHTML='<div class="np"><div class="npt">'+(N.img?'<img class="cov" src="'+N.img+'" alt="">':'')+'<div class="inf"><div class="g"><b>'+esc(N.name)+'</b><span>'+esc(N.artist)+'</span><span>'+esc(N.album)+'</span></div><div class="g"><span class="sm">'+esc(N.meta)+'</span><span class="sm">'+esc(N.dev)+'</span></div></div></div><div class="prog"><i style="width:'+Math.min(100,N.pos/N.dur*100)+'%"></i></div><div class="tm"><span>'+fmt(N.pos)+'</span><span>-'+fmt(N.dur-N.pos)+'</span></div></div>';return;
 }
 b.innerHTML=c.s.items.map(function(it,i){return'<div class="row'+(i===c.sel?' sel':'')+'"><span>'+(it.img?'<img class="th" src="'+it.img+'" alt="">':'')+esc(it.l)+'</span><span>'+(it.go?"›":"")+'</span></div>'}).join("");
 var r=b.children[c.sel];if(r&&b.firstChild){b.firstChild.style.marginTop=-Math.max(0,r.offsetTop-80)+"px"}
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function move(d){var c=cur();if(c.s.np){if(!N)return;N.vol=Math.max(0,Math.min(100,N.vol+d*5));N.vl=Date.now();showVol();clearTimeout(vt);vt=setTimeout(function(){ctl(function(){return api("PUT","/me/player/volume?volume_percent="+Math.round(N.vol))})},300);return}
 var n=c.sel+d;if(n<0||n>=c.s.items.length)return;c.sel=n;render()}
function select(){
 if(player&&player.activateElement)player.activateElement();
 var c=cur();if(c.s.np){return}
 var it=c.s.items[c.sel];if(!it)return;
 if(it.go)push(it.go());
 else if(it.act)it.act();
 else if(it.play){ctl(function(){return doPlay(it.play)});push({t:"np",np:1})}
}
function back(){if(stack.length>1){stack.pop();render()}}
$("bC").onclick=select;$("bM").onclick=back;
$("bP").onclick=function(){ctl(function(){return N&&N.playing?api("PUT","/me/player/pause"):api("PUT","/me/player/play")})};

var w=$("wheel"),last=null,acc=0;
function ang(e){var r=w.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI}
w.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;last=ang(e);acc=0;w.setPointerCapture(e.pointerId)});
w.addEventListener("pointermove",function(e){if(last===null)return;var a=ang(e),d=a-last;if(d>180)d-=360;if(d<-180)d+=360;last=a;acc+=d;
 while(acc>=24){acc-=24;move(1)}while(acc<=-24){acc+=24;move(-1)}});
w.addEventListener("pointerup",function(){last=null});w.addEventListener("pointercancel",function(){last=null});
